$kind: http-request
name: '15 - Request Verification Email'
order: 15000
method: POST
url: '{{base_url}}/api/v1/users/verify_email'
headers:
  - key: X-CSRF-Token
    value: '{{csrf_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200 OK', () => {
        pm.response.to.have.status(200);
      });

      pm.test('Response body is valid JSON', () => {
        pm.response.to.be.json;
      });

      pm.test('Verification email sent message returned', () => {
        const data = pm.response.json();
        pm.expect(data.message).to.equal('verification email sent');
      });

      pm.sendRequest({
        url: pm.collectionVariables.get('base_url') + '/api/v1/csrf-token',
        method: 'GET'
      }, (err, res) => {
        if (!err && res.code === 200) {
          pm.collectionVariables.set('csrf_token', res.json().csrf_token);
        }
      });