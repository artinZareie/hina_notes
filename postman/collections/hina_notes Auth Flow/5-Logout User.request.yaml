$kind: http-request
name: '5 - Logout User'
order: 5000
method: POST
url: '{{base_url}}/api/v1/users/auth/logout'
headers:
  - key: X-CSRF-Token
    value: '{{csrf_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200 OK', () => {
        pm.response.to.have.status(200);
      });

      pm.test('Logout response confirms session ended', () => {
        const data = pm.response.json();
        pm.expect(data.message).to.equal('logged out');
      });

      pm.test('Response time is acceptable', () => {
        pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      // Clear the CSRF token after logout
      pm.collectionVariables.set('csrf_token', '');
