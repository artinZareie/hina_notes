$kind: http-request
name: '3 - Login User'
order: 3000
method: POST
url: '{{base_url}}/api/v1/users/auth/login'
headers:
  - key: Content-Type
    value: application/json
  - key: X-CSRF-Token
    value: '{{csrf_token}}'
body:
  type: json
  content: |-
    {
      "email": "{{test_email}}",
      "password": "{{test_password}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200 OK', () => {
        pm.response.to.have.status(200);
      });

      pm.test('Response body is valid JSON', () => {
        pm.response.to.be.json;
      });

      pm.test('Response contains user data', () => {
        const data = pm.response.json();
        pm.expect(data.user).to.be.an('object');
        pm.expect(data.user.email).to.equal(pm.collectionVariables.get('test_email'));
      });

      pm.test('Session cookie is set', () => {
        const cookies = pm.response.cookies;
        pm.expect(cookies).to.not.be.empty;
      });

      pm.test('Response time is acceptable', () => {
        pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      // Fetch a fresh CSRF token for the logout request (step 5).
      pm.sendRequest({
        url: pm.collectionVariables.get('base_url') + '/api/v1/csrf-token',
        method: 'GET'
      }, (err, res) => {
        if (!err && res.code === 200) {
          pm.collectionVariables.set('csrf_token', res.json().csrf_token);
        }
      });
