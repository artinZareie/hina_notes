$kind: http-request
name: '17 - Change Password'
order: 17000
method: PUT
url: '{{base_url}}/api/v1/users/me/password'
headers:
  - key: Content-Type
    value: application/json
  - key: X-CSRF-Token
    value: '{{csrf_token}}'
body:
  type: json
  content: |-
    {
      "current_password": "{{test_password}}",
      "new_password": "NewStrongPassword123!"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200 OK', () => {
        pm.response.to.have.status(200);
      });

      pm.test('Response body is valid JSON', () => {
        pm.response.to.be.json;
      });

      pm.test('Password updated message returned', () => {
        const data = pm.response.json();
        pm.expect(data.message).to.equal('password updated');
        pm.collectionVariables.set('test_password', 'NewStrongPassword123!');
      });

      pm.sendRequest({
        url: pm.collectionVariables.get('base_url') + '/api/v1/csrf-token',
        method: 'GET'
      }, (err, res) => {
        if (!err && res.code === 200) {
          pm.collectionVariables.set('csrf_token', res.json().csrf_token);
        }
      });