$kind: http-request
name: '16 - Update User Name'
order: 16000
method: PATCH
url: '{{base_url}}/api/v1/users/me'
headers:
  - key: Content-Type
    value: application/json
  - key: X-CSRF-Token
    value: '{{csrf_token}}'
body:
  type: json
  content: |-
    {
      "name": "Updated Hina User"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200 OK', () => {
        pm.response.to.have.status(200);
      });

      pm.test('Response body is valid JSON', () => {
        pm.response.to.be.json;
      });

      pm.test('User name is updated', () => {
        const data = pm.response.json();
        pm.expect(data.user).to.be.an('object');
        pm.expect(data.user.name).to.equal('Updated Hina User');
      });

      pm.sendRequest({
        url: pm.collectionVariables.get('base_url') + '/api/v1/csrf-token',
        method: 'GET'
      }, (err, res) => {
        if (!err && res.code === 200) {
          pm.collectionVariables.set('csrf_token', res.json().csrf_token);
        }
      });