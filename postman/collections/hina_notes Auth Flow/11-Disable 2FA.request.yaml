$kind: http-request
name: '11 - Disable 2FA'
order: 11000
method: POST
url: '{{base_url}}/api/v1/users/auth/2fa/disable'
headers:
  - key: X-CSRF-Token
    value: '{{csrf_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200 OK', () => {
        pm.response.to.have.status(200);
      });

      pm.test('2FA disabled message returned', () => {
        const data = pm.response.json();
        pm.expect(data.message).to.equal('two-factor authentication disabled');
      });

      pm.sendRequest({
        url: pm.collectionVariables.get('base_url') + '/api/v1/csrf-token',
        method: 'GET'
      }, (err, res) => {
        if (!err && res.code === 200) {
          pm.collectionVariables.set('csrf_token', res.json().csrf_token);
        }
      });
