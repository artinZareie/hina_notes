$kind: http-request
name: '13 - Delete Account (With 2FA Enabled)'
order: 13000
method: DELETE
url: '{{base_url}}/api/v1/users/me'
headers:
  - key: X-CSRF-Token
    value: '{{csrf_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200 OK', () => {
        pm.response.to.have.status(200);
      });

      pm.test('Response body is valid JSON', () => {
        pm.response.to.be.json;
      });

      pm.test('Account deletion confirmed', () => {
        const data = pm.response.json();
        pm.expect(data.message).to.equal('account deleted');
      });

      pm.collectionVariables.set('csrf_token', '');

      pm.sendRequest({
        url: pm.collectionVariables.get('base_url') + '/api/v1/users/auth/me',
        method: 'GET'
      }, (err, res) => {
        pm.test('Session is invalidated after account deletion (401)', () => {
          pm.expect(err).to.be.null;
          pm.expect(res.code).to.equal(401);
        });
      });